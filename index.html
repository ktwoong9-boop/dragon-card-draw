<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070914">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="카드뽑기">
  <title>드래곤카드 뽑기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tablet.css">
</head>
<body>
  <section id="gate" aria-label="시작">
    <div class="gate-card" aria-hidden="true"></div>
    <h1>드래곤카드 뽑기</h1>
    <p>화면을 눌러 시작하세요</p>
    <p id="gate-status" class="gate-status"></p>
  </section>

  <section id="intro" hidden aria-label="인트로">
    <video id="intro-video" src="assets/intro.mp4" muted playsinline preload="auto"></video>
    <button id="skip-intro" type="button">건너뛰기</button>
  </section>

  <section id="home" aria-label="시작 화면">
    <button id="open-draw" class="image-btn draw-launch" type="button">
      <img src="assets/draw-button.png" alt="카드 뽑기">
    </button>
    <button id="open-gallery" class="gallery-launch" type="button">
      <span class="gallery-icon" aria-hidden="true"></span>
      <span>갤러리</span>
      <em id="gallery-count">0</em>
    </button>
    <button id="toggle-music" class="corner-btn music-btn" type="button" aria-label="배경음악 끄기">
      <span class="music-on">♪</span>
    </button>
    <button id="install-app" class="corner-btn install-btn" type="button" hidden>앱 설치</button>
  </section>

  <section id="gallery" hidden aria-label="갤러리">
    <header class="gallery-head">
      <div>
        <p class="eyebrow">내 카드</p>
        <h2>갤러리</h2>
        <p id="gallery-summary">아직 뽑은 카드가 없습니다.</p>
      </div>
      <div class="gallery-tools">
        <button id="select-mode" class="btn ghost" type="button">선택</button>
        <button id="select-all" class="btn ghost" type="button" hidden>전체 선택</button>
        <button id="save-selected" class="btn gold" type="button" hidden disabled>저장</button>
        <button id="close-gallery" class="btn ghost" type="button">돌아가기</button>
      </div>
    </header>
    <div id="gallery-grid" class="gallery-grid"></div>
  </section>

  <div id="viewer" hidden>
    <div class="viewer-box">
      <button id="viewer-card" class="viewer-card" type="button" aria-label="카드 뒤집기">
        <span class="inner">
          <span id="viewer-front" class="face front-flat face-front"></span>
          <span id="viewer-back" class="face back-flat face-backhalf"></span>
        </span>
      </button>
      <h3 id="viewer-name">카드</h3>
      <p id="viewer-meta"></p>
      <p class="hint">카드를 누르면 뒷면을 볼 수 있습니다</p>
      <div class="actions">
        <button id="viewer-save" class="btn ghost" type="button">원본 저장</button>
        <button id="viewer-close" class="btn gold" type="button">닫기</button>
      </div>
    </div>
  </div>

  <section id="pick" hidden aria-label="카드 선택">
    <div class="pick-copy">
      <p id="pick-note" class="eyebrow">코드가 확인되었습니다</p>
      <h2 id="pick-title">카드를 나눠 주는 중…</h2>
      <p>고른 카드 한 장만 획득해서 갤러리에 저장됩니다.</p>
    </div>
    <div id="pick-row" class="pick-row"></div>
  </section>

  <div id="code-layer" hidden>
    <form id="code-form" class="modal">
      <p class="eyebrow">카드 뽑기</p>
      <h2>코드 입력</h2>
      <p>받은 코드 5자리를 입력해 주세요.</p>
      <input id="code-input" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="ABCDE" aria-label="코드 5자리">
      <p class="hint">영문과 숫자 5자리 · 0, O, 1, I, L 은 없습니다</p>
      <p id="code-error" class="error" role="alert"></p>
      <div class="actions">
        <button id="code-cancel" class="btn ghost" type="button">닫기</button>
        <button class="btn gold" type="submit">카드 뽑기</button>
      </div>
    </form>
  </div>

  <div id="reveal-layer" hidden>
    <div class="modal reveal-modal">
      <p class="eyebrow">획득</p>
      <h2 id="reveal-name">카드</h2>
      <div id="reveal-card" class="reveal-card face-front"></div>
      <p>갤러리에 저장되었습니다.</p>
      <div class="actions">
        <button id="reveal-gallery" class="btn ghost" type="button">갤러리 보기</button>
        <button id="reveal-ok" class="btn gold" type="button">확인</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" hidden></div>
  <script src="js/sha256.js"></script>
  <script src="js/code-input.js"></script>
  <script src="js/tablet.js"></script>
</body>
</html>
